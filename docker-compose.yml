version: "3.8"
services:
  test-target:
    build: .
    command: python test_target/app.py
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  security-api:
    build: .
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/security_assessment.db
      - TARGET_URL=http://test-target:8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - security_data:/app/data
      - reports_data:/app/reports
      - evidence_data:/app/evidence
    depends_on:
      test-target:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://security-api:8000
      - TARGET_URL=http://test-target:8080
    volumes:
      - reports_data:/app/reports
    depends_on:
      security-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  security_data:
  reports_data:
  evidence_data:
